<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SENAI</title>

    <link rel="stylesheet" href="stely.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

        
            <img 
                src="img.png" 
                alt="Logo SENAI" 
                class="logo"
            >

            <h1>Bem-vindo!</h1>

            <p>Faça login aqui!</p>

            <form>

            
                <div class="input-box">

                    <label for="email">
                        E-mail
                    </label>

                    <input 
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

             
                <div class="input-box">

                    <label for="senha">
                        Senha
                    </label>

                    <input 
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

              
             
                <button type="submit">
                    ENTRAR
                </button>

               
              

            </form>

        </div>

    </div>

</body>

</html>
